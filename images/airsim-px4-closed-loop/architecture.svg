<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <defs>
    <style>
      text { font-family: 'JetBrains Mono', monospace; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1000" height="700" fill="#0f172a"/>
  
        <defs>
          <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
          </marker>
          <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
          </marker>
          <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid)"/>

        <!-- ===== AirSim Boundary ===== -->
        <rect x="30" y="30" width="440" height="640" rx="12" fill="rgba(34, 211, 238, 0.04)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
        <text x="42" y="50" fill="#22d3ee" font-size="10" font-weight="600">AirSim (Unreal Engine / Unity)</text>

        <!-- ===== PX4 Boundary ===== -->
        <rect x="510" y="30" width="460" height="640" rx="12" fill="rgba(251, 191, 36, 0.04)" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
        <text x="522" y="50" fill="#fbbf24" font-size="10" font-weight="600">PX4 SITL Process</text>

        <!-- ===== AirSim Side ===== -->

        <!-- PhysicsBody -->
        <rect x="180" y="80" width="130" height="60" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <rect x="180" y="80" width="130" height="60" rx="6" fill="#0f172a"/>
        <rect x="180" y="80" width="130" height="60" rx="6" fill="rgba(8, 51, 68, 0.3)"/>
        <text x="245" y="104" fill="white" font-size="11" font-weight="600" text-anchor="middle">PhysicsBody</text>
        <text x="245" y="122" fill="#94a3b8" font-size="8" text-anchor="middle">pose, velocity, accel</text>

        <!-- Sensors -->
        <rect x="180" y="175" width="130" height="65" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <rect x="180" y="175" width="130" height="65" rx="6" fill="#0f172a"/>
        <rect x="180" y="175" width="130" height="65" rx="6" fill="rgba(6, 78, 59, 0.3)"/>
        <text x="245" y="197" fill="white" font-size="11" font-weight="600" text-anchor="middle">SensorCollection</text>
        <text x="245" y="215" fill="#94a3b8" font-size="8" text-anchor="middle">IMU / Baro / Mag</text>
        <text x="245" y="228" fill="#94a3b8" font-size="8" text-anchor="middle">GPS / Distance</text>

        <!-- MavLinkMultirotorApi -->
        <rect x="155" y="275" width="180" height="80" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <rect x="155" y="275" width="180" height="80" rx="6" fill="#0f172a"/>
        <rect x="155" y="275" width="180" height="80" rx="6" fill="rgba(120, 53, 15, 0.2)"/>
        <text x="245" y="297" fill="white" font-size="11" font-weight="600" text-anchor="middle">MavLinkMultirotorApi</text>
        <text x="245" y="315" fill="#94a3b8" font-size="8" text-anchor="middle">sendHILSensor()   sendHILGps()</text>
        <text x="245" y="330" fill="#94a3b8" font-size="8" text-anchor="middle">sendSystemTime()  lockstep ctrl</text>
        <text x="245" y="345" fill="#fbbf24" font-size="7" text-anchor="middle">rotor_controls_[0..7]</text>

        <!-- RotorActuators -->
        <rect x="160" y="480" width="170" height="90" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <rect x="160" y="480" width="170" height="90" rx="6" fill="#0f172a"/>
        <rect x="160" y="480" width="170" height="90" rx="6" fill="rgba(76, 29, 149, 0.3)"/>
        <text x="245" y="504" fill="white" font-size="11" font-weight="600" text-anchor="middle">RotorActuator[] x4</text>
        <text x="245" y="522" fill="#94a3b8" font-size="8" text-anchor="middle">thrust ∝ control_signal</text>
        <text x="245" y="538" fill="#94a3b8" font-size="8" text-anchor="middle">torque ∝ direction</text>
        <text x="245" y="554" fill="#94a3b8" font-size="8" text-anchor="middle">speed = √(ctrl × max_speed²)</text>
        <text x="245" y="568" fill="#a78bfa" font-size="7" text-anchor="middle">QuadX: CW/CCW pairs</text>

        <!-- RotorParams -->
        <rect x="370" y="495" width="85" height="55" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="412" y="517" fill="white" font-size="10" font-weight="600" text-anchor="middle">RotorParams</text>
        <text x="412" y="535" fill="#94a3b8" font-size="8" text-anchor="middle">max_thrust</text>
        <text x="412" y="548" fill="#94a3b8" font-size="8" text-anchor="middle">max_torque</text>

        <!-- ===== PX4 Side ===== -->

        <!-- sim_mavlink -->
        <rect x="550" y="275" width="140" height="60" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <rect x="550" y="275" width="140" height="60" rx="6" fill="#0f172a"/>
        <rect x="550" y="275" width="140" height="60" rx="6" fill="rgba(120, 53, 15, 0.2)"/>
        <text x="620" y="296" fill="white" font-size="10" font-weight="600" text-anchor="middle">simulator_mavlink</text>
        <text x="620" y="314" fill="#94a3b8" font-size="8" text-anchor="middle">HIL_SENSOR → uORB</text>
        <text x="620" y="328" fill="#fbbf24" font-size="7" text-anchor="middle">UDP :4560</text>

        <!-- sensors -->
        <rect x="730" y="275" width="120" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <rect x="730" y="275" width="120" height="60" rx="6" fill="#0f172a"/>
        <rect x="730" y="275" width="120" height="60" rx="6" fill="rgba(6, 78, 59, 0.3)"/>
        <text x="790" y="296" fill="white" font-size="10" font-weight="600" text-anchor="middle">sensors/vehicle</text>
        <text x="790" y="314" fill="#94a3b8" font-size="8" text-anchor="middle">IMU / GPS topics</text>
        <text x="790" y="328" fill="#34d399" font-size="7" text-anchor="middle">uORB publish</text>

        <!-- EKF2 -->
        <rect x="730" y="365" width="120" height="55" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
        <rect x="730" y="365" width="120" height="55" rx="6" fill="#0f172a"/>
        <rect x="730" y="365" width="120" height="55" rx="6" fill="rgba(136, 19, 55, 0.3)"/>
        <text x="790" y="387" fill="white" font-size="10" font-weight="600" text-anchor="middle">EKF2</text>
        <text x="790" y="405" fill="#94a3b8" font-size="8" text-anchor="middle">state estimation</text>
        <text x="790" y="418" fill="#fb7185" font-size="7" text-anchor="middle">24-state EKF</text>

        <!-- Controller Cascade -->
        <rect x="580" y="365" width="130" height="80" rx="6" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1.5"/>
        <rect x="580" y="365" width="130" height="80" rx="6" fill="#0f172a"/>
        <rect x="580" y="365" width="130" height="80" rx="6" fill="rgba(8, 51, 68, 0.3)"/>
        <text x="645" y="387" fill="white" font-size="10" font-weight="600" text-anchor="middle">Cascade PID</text>
        <text x="645" y="407" fill="#94a3b8" font-size="8" text-anchor="middle">pos → vel → att</text>
        <text x="645" y="422" fill="#94a3b8" font-size="8" text-anchor="middle">→ rate → mixer</text>
        <text x="645" y="437" fill="#22d3ee" font-size="7" text-anchor="middle">mc_*_control modules</text>

        <!-- Mixer -->
        <rect x="580" y="480" width="130" height="55" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <rect x="580" y="480" width="130" height="55" rx="6" fill="#0f172a"/>
        <rect x="580" y="480" width="130" height="55" rx="6" fill="rgba(76, 29, 149, 0.3)"/>
        <text x="645" y="502" fill="white" font-size="10" font-weight="600" text-anchor="middle">Mixer</text>
        <text x="645" y="520" fill="#94a3b8" font-size="8" text-anchor="middle">quad_x.main.mix</text>
        <text x="645" y="533" fill="#a78bfa" font-size="7" text-anchor="middle">4→4 motor mapping</text>

        <!-- HIL Actuator Controls -->
        <rect x="550" y="570" width="140" height="55" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <rect x="550" y="570" width="140" height="55" rx="6" fill="#0f172a"/>
        <rect x="550" y="570" width="140" height="55" rx="6" fill="rgba(120, 53, 15, 0.2)"/>
        <text x="620" y="592" fill="white" font-size="10" font-weight="600" text-anchor="middle">HIL_ACTUATOR</text>
        <text x="620" y="610" fill="#94a3b8" font-size="8" text-anchor="middle">_CONTROLS msg</text>
        <text x="620" y="623" fill="#fbbf24" font-size="7" text-anchor="middle">controls[0..7]</text>

        <!-- ===== ARROWS ===== -->

        <!-- AirSim internal: PhysicsBody → Sensors -->
        <line x1="245" y1="145" x2="245" y2="173" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

        <!-- AirSim internal: Sensors → MavLinkMultirotorApi -->
        <line x1="245" y1="245" x2="245" y2="273" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

        <!-- HIL_SENSOR / HIL_GPS: AirSim → PX4 -->
        <line x1="300" y1="300" x2="548" y2="295" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
        <text x="424" y="290" fill="#fbbf24" font-size="8" text-anchor="middle">HIL_SENSOR (accel,gyro,mag,baro)</text>
        <line x1="310" y1="325" x2="548" y2="310" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
        <text x="429" y="320" fill="#fbbf24" font-size="8" text-anchor="middle">HIL_GPS (lat,lon,alt,vel)</text>

        <!-- PX4 internal: sim_mavlink → sensors -->
        <line x1="690" y1="295" x2="728" y2="295" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
        <text x="709" y="288" fill="#94a3b8" font-size="7" text-anchor="middle">uORB</text>

        <!-- PX4 internal: sensors → EKF2 -->
        <line x1="790" y1="335" x2="790" y2="363" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

        <!-- PX4 internal: EKF2 → Controller -->
        <line x1="730" y1="395" x2="712" y2="395" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

        <!-- PX4 internal: Controller → Mixer -->
        <line x1="645" y1="445" x2="645" y2="478" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

        <!-- PX4 internal: Mixer → HIL_ACTUATOR_CONTROLS -->
        <line x1="645" y1="535" x2="620" y2="568" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

        <!-- HIL_ACTUATOR_CONTROLS: PX4 → AirSim -->
        <path d="M 550 595 L 500 595 Q 480 595 480 575 L 480 330 Q 480 310 460 310 L 350 310" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
        <text x="380" y="530" fill="#a78bfa" font-size="8">HIL_ACTUATOR_CONTROLS (lockstep sync)</text>

        <!-- MavLinkMultirotorApi → RotorActuator -->
        <line x1="245" y1="355" x2="245" y2="478" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
        <text x="260" y="440" fill="#94a3b8" font-size="7">rotor_controls[0..3]</text>

        <!-- RotorActuator → PhysicsBody (loop back) -->
        <path d="M 245 570 L 245 610 Q 245 650 200 650 L 100 650 Q 60 650 60 620 L 60 140 Q 60 110 100 110 L 150 110" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="110" y="640" fill="#34d399" font-size="8">thrust & torque → PhysicsBody (闭环)</text>

        <!-- RotorParams → RotorActuator -->
        <line x1="412" y1="510" x2="350" y2="505" stroke="#94a3b8" stroke-width="1" marker-end="url(#arrow)"/>
        <text x="381" y="498" fill="#94a3b8" font-size="7">params</text>

        <!-- ===== TIME FLOW ANNOTATION ===== -->
        <rect x="40" y="620" width="120" height="22" rx="4" fill="rgba(251, 146, 60, 0.2)" stroke="#fb923c" stroke-width="1"/>
        <text x="100" y="635" fill="#fb923c" font-size="8" text-anchor="middle">LockStep: sim_time freeze</text>

        <!-- ===== LEGEND ===== -->
        <text x="750" y="620" fill="white" font-size="9" font-weight="600">Legend</text>
        <rect x="750" y="632" width="12" height="8" rx="2" fill="rgba(8, 51, 68, 0.4)" stroke="#22d3ee" stroke-width="1"/>
        <text x="768" y="639" fill="#94a3b8" font-size="7">AirSim</text>
        <rect x="810" y="632" width="12" height="8" rx="2" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
        <text x="828" y="639" fill="#94a3b8" font-size="7">Sensors</text>
        <rect x="870" y="632" width="12" height="8" rx="2" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1"/>
        <text x="888" y="639" fill="#94a3b8" font-size="7">MAVLink</text>
        <rect x="750" y="648" width="12" height="8" rx="2" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1"/>
        <text x="768" y="655" fill="#94a3b8" font-size="7">Filter</text>
        <rect x="810" y="648" width="12" height="8" rx="2" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
        <text x="828" y="655" fill="#94a3b8" font-size="7">Actuators</text>
        <line x1="870" y1="652" x2="882" y2="652" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="888" y="655" fill="#94a3b8" font-size="7">Lockstep</text>
      
</svg>